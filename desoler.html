<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu me pardonnes ? ❤️</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff6f91, #ff9a9e, #ff5f7e);
    position: relative;
  }

  .heart {
    position: absolute;
    color: rgba(255,255,255,.55);
    font-size: 28px;
    animation: float 7s linear infinite;
    user-select: none;
  }

  @keyframes float {
    0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-15vh) rotate(360deg); opacity: 0; }
  }

  .card {
    position: relative;
    z-index: 2;
    width: min(90%, 560px);
    padding: 55px 35px;
    text-align: center;
    border-radius: 30px;
    background: rgba(255,255,255,.18);
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(120, 20, 50, .25);
    border: 1px solid rgba(255,255,255,.35);
  }

  h1 {
    margin: 0 0 35px;
    color: white;
    font-size: clamp(38px, 8vw, 62px);
    text-shadow: 0 4px 15px rgba(120, 0, 40, .2);
  }

  .buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    min-height: 70px;
  }

  button {
    border: none;
    border-radius: 15px;
    padding: 16px 34px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: transform .25s ease, opacity .25s ease, padding .25s ease, font-size .25s ease;
  }

  #yes {
    background: #fff;
    color: #e83e6f;
    box-shadow: 0 8px 20px rgba(0,0,0,.15);
  }

  #no {
    background: rgba(150, 20, 60, .7);
    color: white;
  }

  #yes:hover {
    transform: scale(1.08);
  }

  .message {
    display: none;
    margin-top: 25px;
    color: white;
    font-size: 24px;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="heart" style="left:8%; animation-delay:0s;">♥</div>
<div class="heart" style="left:20%; animation-delay:2s; font-size:20px;">♥</div>
<div class="heart" style="left:35%; animation-delay:4s; font-size:38px;">♥</div>
<div class="heart" style="left:55%; animation-delay:1s; font-size:22px;">♥</div>
<div class="heart" style="left:72%; animation-delay:3s; font-size:34px;">♥</div>
<div class="heart" style="left:88%; animation-delay:5s; font-size:25px;">♥</div>

<div class="card">
  <h1>Tu me pardonnes ? ❤️</h1>

  <div class="buttons">
    <button id="yes">Oui ❤️</button>
    <button id="no">Non 😭</button>
  </div>

  <div class="message" id="message">
    Je savais que tu allais dire oui 🥹❤️
  </div>
</div>

<script>
  const no = document.getElementById("no");
  const yes = document.getElementById("yes");
  const message = document.getElementById("message");

  let scale = 1;

  no.addEventListener("click", () => {
    scale -= 0.18;

    if (scale <= 0.08) {
      no.style.transform = "scale(0)";
      no.style.opacity = "0";
      no.style.pointerEvents = "none";
    } else {
      no.style.transform = `scale(${scale})`;
      no.style.opacity = Math.max(scale, 0.2);
    }
  });

  yes.addEventListener("click", () => {
    message.style.display = "block";
    yes.textContent = "Merci ❤️";
    no.style.display = "none";
  });
</script>

</body>
</html>
